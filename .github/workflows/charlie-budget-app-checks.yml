name: Charlie Budget App Checks

on:
  push:
    branches: [main]
    paths:
      - 'charlie-budget-app/**'
      - '.github/workflows/charlie-budget-app-checks.yml'
  pull_request:
    paths:
      - 'charlie-budget-app/**'
      - '.github/workflows/charlie-budget-app-checks.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: charlie-budget-app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install
        run: npm install

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
